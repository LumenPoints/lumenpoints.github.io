<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LumenPoints — Back Soon</title><meta name="description" content="LumenPoints is under renovation and will be back shortly."><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{min-height:100vh;background:#161C19;color:#EDE6D6;font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:40px 24px;-webkit-font-smoothing:antialiased}
a{color:#C9A978;text-decoration:none;border-bottom:1px solid rgba(201,169,120,.35);transition:color 220ms cubic-bezier(.32,.72,.32,1),border-color 220ms cubic-bezier(.32,.72,.32,1)}
a:hover{color:#EDE6D6;border-color:rgba(237,230,214,.55)}
.wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:40px}
.mark{display:flex;align-items:center;gap:6px}
.star{width:52px;height:52px;flex:none;display:block}
.wordmark{height:56px;width:auto;display:block}
.eyebrow{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#9C9A92;margin:0}
h1{margin:0;font-size:clamp(40px,8vw,64px);font-weight:400;line-height:1.04;letter-spacing:-.02em}
h1 span{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:#C9A978}
.lede{margin:0;font-size:17px;line-height:1.6;color:#B7B2A6;max-width:46ch;text-wrap:pretty}
.meta{display:flex;flex-direction:column;gap:14px;border-top:1px solid #2E3631;padding-top:22px}
.row{display:flex;gap:12px;align-items:baseline;font-size:15px;line-height:1.5}
.row dt{flex:none;width:104px;margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7E7C74}
.row dd{margin:0;color:#EDE6D6}
dl{margin:0;display:flex;flex-direction:column;gap:14px}
</style></head>
<body><main class="wrap">
<div class="mark"><img class="star" src="coming-soon-assets/star-mark.png" alt=""><img class="wordmark" src="coming-soon-assets/wordmark-cream.png" alt="LumenPoints"></div>
<div style="display:flex;flex-direction:column;gap:20px"><p class="eyebrow">Under renovation</p><h1>Back <span>shortly.</span></h1><p class="lede">We're rebuilding a few things behind the scenes. Everything is safe, nothing is going away — the site will be back up in a couple of days.</p></div>
<div class="meta"><dl><div class="row"><dt>Expected</dt><dd>Back online in 2–3 days</dd></div><div class="row"><dt>Questions</dt><dd><a href="mailto:hello@lumenpoints.com">hello@lumenpoints.com</a></dd></div></dl></div>
</main></body></html>
